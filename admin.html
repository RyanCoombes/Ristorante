<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Gestione · Vizi Capitali</title>
  <meta name="theme-color" content="#EE1A37">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Yellowtail&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20261024e">
  <link rel="stylesheet" href="assets/css/admin.css?v=20261024e">
</head>
<body class="admin">
  <!-- PIN screen -->
  <main class="pin-screen" data-pin-screen hidden>
    <form class="pin-card" data-pin-form autocomplete="off">
      <img src="assets/img/logo.png" alt="Vizi Capitali" width="1000" height="438">
      <h1 data-t="pin.title">Area staff</h1>
      <label for="pin" data-t="pin.label">PIN dello staff</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" required>
      <p class="pin-error" data-pin-error hidden></p>
      <button class="btn btn--red btn--block" type="submit" data-t="pin.enter">Entra</button>
      <div class="lang lang--center" role="group" aria-label="Lingua / Language">
        <button type="button" data-admin-lang="it" aria-pressed="true">IT</button>
        <button type="button" data-admin-lang="en" aria-pressed="false">EN</button>
      </div>
    </form>
  </main>

  <!-- Admin app -->
  <div class="admin-app" data-app hidden>
    <header class="admin-head">
      <h1 class="visually-hidden">Gestione Vizi Capitali</h1>
      <img src="assets/img/logo-cream.png" alt="Vizi Capitali" width="1000" height="438">
      <!-- the orders board (ordini.html) is kept for later; link it here again when website orders go live -->
      <a class="view-site" href="index.html" target="_blank" rel="noopener" data-t="nav.site">Vedi il sito</a>
      <div class="admin-head-actions">
        <div class="lang lang--cream" role="group" aria-label="Lingua / Language">
          <button type="button" data-admin-lang="it" aria-pressed="true">IT</button>
          <button type="button" data-admin-lang="en" aria-pressed="false">EN</button>
        </div>
        <button type="button" class="admin-logout" data-logout data-t="app.logout">Esci</button>
      </div>
    </header>

    <nav class="admin-tabs" data-tabs aria-label="Sezioni"></nav>

    <main class="admin-main" data-panel></main>

    <div class="savebar" data-savebar role="region" aria-label="Salvataggio" hidden>
      <p><strong data-savebar-text>Modifiche non salvate</strong><small data-savebar-hint></small></p>
      <div class="savebar-actions">
        <button type="button" class="mini mini--danger" data-act="discard" data-path="">Annulla modifiche</button>
        <a class="btn btn--outline btn--sm" href="index.html" target="_blank" data-act="preview" data-path="">Anteprima</a>
        <button type="button" class="btn btn--red btn--sm" data-act="save" data-path="">Salva e pubblica</button>
      </div>
    </div>
  </div>

  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>

  <script src="data/config.js?v=20261024e"></script>
  <script src="data/menu.js?v=20261024e"></script>
  <!-- saved from Gestione: always fetched fresh, so a save shows straight away (browsers and the host cache .js files) -->
  <script>document.write('<script src="data/live.js?v=' + Date.now() + '"><\/script>');</script>
  <script src="assets/js/themes.js?v=20261024e"></script>
  <script src="assets/js/admin.js?v=20261024e"></script>
</body>
</html>
